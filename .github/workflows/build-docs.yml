name: Build documentation PDFs

on:
  push:
    branches: [main]
    paths:
      - 'docs/04-architecture/architecture-overview.tex'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SRS submission PDF is maintained under docs/08-finalization/deliverables/
      # (OCR-SRS-v2.pdf). Do not compile deleted docs/03-requirements/srs/srs.tex.

      - name: Compile architecture overview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: docs/04-architecture/architecture-overview.tex
          latexmk_use_xelatex: false

      - name: Commit generated documentation
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: update generated architecture overview'
          file_pattern: 'docs/04-architecture/architecture-overview.pdf'
